<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>מנוע תיקונים — לוח קנבן</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 24px;
    direction: rtl;
    color: #1d2939;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #667085; font-size: 13px; margin-bottom: 20px; }
  .board { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: start; }
  .column {
    background: #fff;
    border-radius: 10px;
    padding: 12px;
    min-height: 200px;
    border: 1px solid #e4e7ec;
  }
  .column h2 {
    font-size: 14px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #344054;
  }
  .column h2 .count {
    background: #eef2ff;
    color: #3538cd;
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 12px;
  }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: #fafafa;
    border: 1px solid #eaecf0;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
  }
  .card .note { white-space: pre-wrap; margin-bottom: 6px; }
  .card .meta { color: #98a2b3; font-size: 11px; margin-bottom: 6px; }
  .card .area-badge {
    display: inline-block;
    background: #f2f4f7;
    color: #475467;
    border-radius: 6px;
    padding: 1px 6px;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .card .flag-badge {
    display: block;
    background: #fef0c7;
    color: #93370d;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .card .resolution {
    background: #ecfdf3;
    color: #067647;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .card .actions { display: flex; gap: 6px; margin-top: 6px; }
  .card button {
    font: inherit;
    font-size: 12px;
    border: 1px solid #d0d5dd;
    background: #fff;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .card button:hover { background: #f9fafb; }
  .card button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .empty { color: #98a2b3; font-size: 12px; padding: 8px 0; }
</style>
</head>
<body>
  <h1>🛠 מנוע תיקונים</h1>
  <div class="sub">הערות שנלכדו מתוך האפליקציה — רק כאן ניתן לסמן כרטיס כ"הושלם".</div>
  <div class="board">
    <div class="column" data-status="entered">
      <h2>הזנתי <span class="count" id="count-entered">0</span></h2>
      <div class="cards" id="cards-entered"></div>
    </div>
    <div class="column" data-status="in_progress">
      <h2>בטיפול <span class="count" id="count-in_progress">0</span></h2>
      <div class="cards" id="cards-in_progress"></div>
    </div>
    <div class="column" data-status="done">
      <h2>הושלם <span class="count" id="count-done">0</span></h2>
      <div class="cards" id="cards-done"></div>
    </div>
  </div>
  <script src="board.js"></script>
</body>
</html>
